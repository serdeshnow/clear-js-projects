<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Weather Sounds</title>
</head>
<body>
	<h1 class="title">Nature weather sounds</h1>
	<div class="button__container">
		<button class="button" id="rain"><span class="button-ico"></span></button>
		<button class="button" id="forest"><span class="button-ico"></span></button>
		<button class="button" id="waves"><span class="button-ico"></span></button>
	</div>
	<div class="volume-control">
		<label for="volume">Volume:</label>
		<input type="range" id="volume" min="0" max="1" step="0.01">
	</div>
</body>
</html>
